<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>腸嚐新知 · 大腸直腸外科文獻</title>
<meta name="description" content="每日 PubMed 大腸直腸外科新文獻，中文摘要與臨床重點">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="腸嚐新知">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════ 馬卡龍調色盤 ═══════════════
   一盤馬卡龍：每張卡是一個口味。
   淺色底、深色字、圓角、柔和陰影。

   但語意色不參與輪換 —— 評分永遠是綠/琥珀/紅，
   那是分診訊號，不能被裝飾蓋掉。
*/
:root{
  --paper:#FBF7F4;          /* 底：微暖的米白 */
  --ink:#3B3440;            /* 主文字：暖炭灰，不是純黑 */
  --muted:#78707F;
  --dim:#A79FAF;
  --line:rgba(59,52,64,.10);
  --line-soft:rgba(59,52,64,.06);

  /* 語意色（固定） */
  --good:#2E9E6B;
  --mid:#C9821E;
  --bad:#D6455F;

  --nav-h:62px;
  --pad:20px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* 保險絲：長的英文詞／DOI／URL 不准把容器撐寬。
   中文本來就能任意斷行，出問題的一律是英文長字串。 */
.card,.body,.chips,.hdr-r{min-width:0}
.body{overflow-wrap:anywhere}
html,body{
  height:100%;overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* 唯一的捲動容器。沒有 scroll-snap ——
   之前 mandatory 吸附 + 內層捲動容器互相打架，
   手機慣性滑動會帶著動量一口氣跨過好幾張卡。 */
#feed{
  height:100dvh;overflow-y:scroll;
  /* ⚠️ 一定要明寫 overflow-x:hidden。
     CSS 規範：一軸是 scroll、另一軸是 visible 時，visible 會被算成 auto。
     只要卡片內有任何元素比視窗寬（PICO 表格、長 DOI、長英文詞），
     #feed 就多出一條水平捲軸 —— 手指帶點橫向就把整個 feed 推走，
     卡片往左偏、右邊露出一條空白。 */
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  overscroll-behavior-y:contain;
  scroll-behavior:smooth;
}
#feed::-webkit-scrollbar{display:none}

/* ═══════════════ 卡片顏色 = 訊息，不是裝飾 ═══════════════

   之前是六種口味「輪流換」—— 顏色由「第幾張卡」決定，跟內容毫無關係。
   那是噪音。現在顏色直接回答一個問題：這篇我該不該花時間？

     🌹 玫瑰 = 必讀   —— 追蹤命中 / 跟你已知的矛盾 / 高分又高度相關
     🩵 天藍 = 相關   —— 一般該讀的
     ⬜ 灰   = 可略過 —— 低度相關或低分，視覺上刻意「退後」

   評分的紅綠燈（綠/琥珀/紅）是另一個軸：那是「品質」。
   卡片底色是「跟你的相關程度」。兩個軸不衝突。
*/
.card{
  min-height:100dvh;
  position:relative;display:flex;flex-direction:column;
  --a:#4A8FC0; --soft:#E7F2FB; --tint:#F3F9FD;   /* 預設＝相關 */
}

/* 必讀 —— 暖色，往前跳出來 */
.card.t-must{
  --a:#D94F86;
  --soft:#FFE2EC;
  --tint:#FFF2F6;
}
/* 相關 —— 冷靜的藍 */
.card.t-rel{
  --a:#4A8FC0;
  --soft:#E7F2FB;
  --tint:#F3F9FD;
}
/* 可略過 —— 去飽和，視覺上退後 */
.card.t-low{
  --a:#9C97A3;
  --soft:#F2F1F3;
  --tint:#F9F8FA;
}
.card{background:var(--soft)}

/* 必讀的卡片再多一道左邊界，滑過去很難錯過 */
.card.t-must::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;
  width:4px;
  background:linear-gradient(180deg,#D94F86,#F0A0C0);
  z-index:7;
}

/* 右上角一顆柔光，像馬卡龍的高光 */
.card::after{
  content:'';position:absolute;
  top:-10%;right:-14%;
  width:56%;aspect-ratio:1;border-radius:50%;
  background:#fff;opacity:.5;
  filter:blur(70px);pointer-events:none;
}

/* ═══════════════ HEADER ═══════════════ */
.hdr{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) 10px;
  position:sticky;top:0;z-index:6;
  background:color-mix(in srgb, var(--soft) 88%, transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.brand{
  font-family:'Noto Serif TC',serif;font-weight:900;
  font-size:18px;letter-spacing:.5px;color:var(--ink);
}
.brand em{font-style:normal;color:var(--a)}
.hdr-r{display:flex;align-items:center;gap:7px}
.newday{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;font-weight:700;letter-spacing:.08em;
  color:#fff;background:var(--a);
  padding:4px 9px 3px;border-radius:20px;line-height:1;white-space:nowrap;
  box-shadow:0 2px 8px color-mix(in srgb,var(--a) 40%,transparent);
}
.hdr-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;
}

/* 不再是獨立的捲動容器 —— 整個 feed 只有一層捲動，滑起來才不會打架 */
.body{
  flex:1;
  padding:6px var(--pad) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px);
  position:relative;z-index:2;
}

/* ═══════════════ CHIPS ═══════════════ */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:5px 10px 4px;border-radius:20px;line-height:1;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.chip-ev{background:var(--a);color:#fff}
.chip-ev.weak{background:#fff;color:var(--a);box-shadow:inset 0 0 0 1.5px var(--a)}

/* 評分：語意色，固定 */
.chip-score i{font-style:normal;opacity:.65;font-size:9px}
.chip-score.hi {background:var(--good);color:#fff}
.chip-score.mid{background:var(--mid); color:#fff}
.chip-score.lo {background:var(--bad);  color:#fff}

.chip-rel.hi {background:rgba(59,52,64,.10);color:var(--ink)}
.chip-rel.mid{background:rgba(59,52,64,.05);color:var(--muted)}
.chip-rel.lo {background:rgba(59,52,64,.03);color:var(--dim);opacity:.7}

.chip-nov.hi   {background:#fff;color:#3B7FA6;box-shadow:inset 0 0 0 1.5px #9CCBE4}
.chip-nov.mid  {background:rgba(59,52,64,.05);color:var(--muted)}
.chip-nov.early{background:#fff;color:#7B5EA8;box-shadow:inset 0 0 0 1.5px #C0AEDD}
.chip-nov.neg  {background:rgba(59,52,64,.05);color:var(--dim)}

.chip-j{background:rgba(255,255,255,.75);color:var(--muted)}
.jif{font-weight:800;color:var(--a);padding-left:6px;border-left:1px solid var(--line)}
.chip-j.hi{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--a)}

/* ═══════════════ 標題 ═══════════════ */
.title-zh{
  font-family:'Noto Serif TC',serif;font-weight:700;
  font-size:clamp(20px,5vw,25px);line-height:1.45;
  color:#2A2430;margin-bottom:7px;text-wrap:pretty;
}
.title-en{
  font-size:12px;line-height:1.55;color:var(--dim);
  margin-bottom:6px;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.byline{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);
  padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid var(--line-soft);
}

/* ═══════════════ 一句話結論 ═══════════════ */
.sec{margin-bottom:12px}
.oneliner{
  font-size:15px;line-height:1.8;font-weight:500;color:#2A2430;
  padding:15px 16px;border-radius:16px;
  background:#fff;
  border-left:4px solid var(--a);
  box-shadow:0 4px 16px color-mix(in srgb,var(--a) 14%,transparent);
}
.score-why{
  margin-top:7px;padding:0 4px;
  font-size:11px;line-height:1.6;color:var(--dim);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ═══════════════ 明天可以怎麼做 ═══════════════ */
.action{
  border-radius:16px;padding:13px 15px;
  background:#FFF9E8;
  border:1.5px solid #F0D07A;
  box-shadow:0 4px 14px rgba(201,130,30,.10);
}
.action-mark{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;font-weight:800;letter-spacing:.1em;
  color:#fff;background:var(--mid);
  padding:4px 9px 3px;border-radius:20px;margin-bottom:8px;line-height:1;
}
.action p{font-size:14px;line-height:1.75;color:#6B4A11;font-weight:500}

/* ═══════════════ 條列 ═══════════════ */
.eyebrow{
  display:flex;align-items:center;gap:8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--a);margin-bottom:8px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.eyebrow.warm{color:var(--mid)}

.points{list-style:none;display:flex;flex-direction:column;gap:7px}
.points li{
  position:relative;padding-left:17px;
  font-size:13.5px;line-height:1.7;color:var(--ink);
}
.points li::before{
  content:'';position:absolute;left:0;top:.6em;
  width:7px;height:7px;border-radius:50%;background:var(--a);
}
.points.warn li::before{background:var(--mid);border-radius:2px;height:3px;width:9px;top:.78em}
.points.warn li{color:#5C4A2E}

.unass{
  font-size:11px;line-height:1.65;color:var(--muted);
  background:rgba(255,255,255,.7);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.unass b{color:var(--dim);font-weight:800;font-size:9.5px;letter-spacing:.06em;margin-right:6px}

/* ═══════════════ 折疊 ═══════════════ */
.acc{
  border:1px solid var(--line);border-radius:14px;
  margin-bottom:10px;overflow:hidden;background:rgba(255,255,255,.6);
}
.acc summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:12px 14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--a);user-select:none;
}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:#fff}
.acc summary:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.acc summary svg{width:12px;height:12px;transition:transform .2s;flex:none}
.acc[open] summary svg{transform:rotate(180deg)}
.acc[open] summary{border-bottom:1px solid var(--line-soft)}
.acc-in{padding:15px 14px;background:#fff}

/* table-layout:fixed —— 沒有這行，auto 佈局會為了塞下長英文詞
   （DOI、ileocolic、藥名）把表格撐超過 100%，整張卡片就溢出了。 */
.pico{width:100%;table-layout:fixed;border-collapse:collapse;margin-bottom:14px}
.pico td,.pico th{overflow-wrap:anywhere;word-break:break-word}
.pico th{
  width:24px;text-align:left;vertical-align:top;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:800;color:var(--a);
  padding:7px 8px 7px 0;border-bottom:1px solid var(--line-soft);
}
.pico td{
  font-size:13px;line-height:1.7;color:var(--ink);font-weight:400;
  padding:7px 0;border-bottom:1px solid var(--line-soft);
}
.pico tr:last-child th,.pico tr:last-child td{border-bottom:none}
.prose{font-size:13.5px;line-height:1.9;color:var(--ink);font-weight:400}

/* ═══════════════ 動作列 ═══════════════ */
.acts{
  display:flex;align-items:center;gap:7px;
  padding-top:13px;border-top:1px solid var(--line-soft);
  flex-wrap:wrap;
}
/* 收錄時間 / PMID 自己一行，不跟按鈕擠 */
.meta-row{
  display:flex;align-items:center;gap:6px;
  margin-top:9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;color:var(--dim);
}
.meta-row svg{width:10px;height:10px;opacity:.7;flex:none}
.meta-row .dot{opacity:.45}
.meta-row .pm{margin-left:auto}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:9px 14px;border-radius:20px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  cursor:pointer;text-decoration:none;transition:all .15s;
}
.btn:hover{color:#fff;background:var(--a);border-color:var(--a)}
.btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.btn svg{width:13px;height:13px;flex:none}


/* ═══════════════ 翻頁鈕（右側浮動） ═══════════════
   平常滑動 = 一般捲動（順、可預測）
   要換論文 = 按這個（精準、一次一篇）        */
#pager{
  position:fixed;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  z-index:80;
  display:flex;flex-direction:column;align-items:stretch;
  border-radius:22px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--line);
  box-shadow:0 6px 22px rgba(59,52,64,.14);
  overflow:hidden;
  opacity:.62;
  transition:opacity .25s;
}
#pager:hover,#pager:focus-within,#pager.active{opacity:1}
@media (hover:none){ #pager{opacity:.9} }

.pg{
  width:44px;height:42px;
  display:grid;place-items:center;
  background:none;border:none;cursor:pointer;
  color:var(--muted);
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;
}
.pg:hover:not(:disabled){background:var(--soft);color:var(--a)}
.pg:active:not(:disabled){background:var(--a);color:#fff}
.pg:focus-visible{outline:2px solid var(--a);outline-offset:-3px}
.pg:disabled{opacity:.28;cursor:default}
.pg svg{width:19px;height:19px}

#pg-pos{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;font-weight:700;
  color:var(--muted);
  text-align:center;
  padding:5px 0 4px;
  border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft);
  line-height:1.25;
  user-select:none;
}
#pg-pos b{display:block;color:var(--a);font-size:12px;font-weight:800}


/* ═══════════════ 與過去文獻的關係 ═══════════════ */
.ctx{
  border-radius:16px;
  padding:13px 15px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 3px 12px rgba(59,52,64,.05);
}
.ctx-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ctx-v{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;font-weight:800;letter-spacing:.08em;
  padding:4px 9px 3px;border-radius:20px;line-height:1;color:#fff;
}
.ctx-v.same {background:#5C9E7D}   /* 再確認 */
.ctx-v.diff {background:#D6455F}   /* 與前作矛盾 —— 最該注意的 */
.ctx-v.ext  {background:#4F8FC0}   /* 延伸前作 */
.ctx-v.none {background:var(--dim)}/* 無相關前作 */
.ctx-lbl{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.ctx p{font-size:13.5px;line-height:1.75;color:var(--ink)}

.rel{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.rel-hd{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px;
}
.rel-i{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 9px;margin-bottom:5px;
  border-radius:10px;border:1px solid var(--line-soft);
  background:#FBF7F4;color:var(--ink);
  cursor:pointer;font-family:inherit;text-align:left;
  transition:border-color .15s,background .15s;
}
.rel-i:hover{border-color:var(--a);background:var(--tint)}
.rel-i:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.rel-s{
  flex:none;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:800;color:#fff;
}
.rel-s.hi{background:var(--good)}.rel-s.mid{background:var(--mid)}
.rel-s.lo{background:var(--bad)} .rel-s.na{background:var(--dim)}
.rel-t{
  flex:1;min-width:0;font-size:12px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.rel-d{
  flex:none;font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;color:var(--dim);
}

/* ═══════════════ 效果量（程式驗算，非模型口述） ═══════════════ */
.eff{
  border-radius:14px;
  border:1px solid var(--line);
  background:#fff;
  overflow:hidden;
  margin-bottom:12px;
}
.eff-hd{
  display:flex;align-items:center;gap:6px;
  padding:9px 13px;
  background:#F6F9F7;
  border-bottom:1px solid var(--line-soft);
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;font-weight:700;letter-spacing:.1em;
  color:#2E7D5B;
}
.eff-hd svg{width:11px;height:11px}
.eff-i{padding:11px 13px;border-bottom:1px solid var(--line-soft)}
.eff-i:last-child{border-bottom:none}
.eff-o{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.eff-arms{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px;
}
.eff-arms b{color:var(--ink);font-weight:700}
.eff-r{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;
}
.eff-tag{
  font-weight:800;padding:3px 8px 2px;border-radius:6px;color:#fff;line-height:1;
}
.eff-tag.nnt{background:#2E9E6B}
.eff-tag.nnh{background:#D6455F}
.eff-arr{color:var(--muted)}
.eff-say{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.eff-no{
  padding:11px 13px;
  font-size:11.5px;line-height:1.65;color:var(--dim);
}
.eff-no b{color:var(--muted);display:block;font-size:11px;margin-bottom:3px}

/* ═══════════════ 追蹤標記 ═══════════════ */
.chip-watch{
  background:#fff;color:#C2185B;
  box-shadow:inset 0 0 0 1.5px #F48FB1;
}
.chip-must{
  background:#D94F86;color:#fff;

<body>

<div id="boot">
  <div class="boot-in">
    <div class="boot-mark">腸嚐新知</div>

</div>

<main id="feed" aria-live="polite"></main>

<div id="pager" aria-label="翻頁">
  <button class="pg" id="pg-up" onclick="jump(-1)" aria-label="上一篇" title="上一篇 (↑ / k)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>

  </button>
</div>

<nav id="nav">
  <button class="nav-btn on" id="nb-home" onclick="goLatest()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    最新<span id="nb-badge"></span>
  </button>
  <button class="nav-btn" id="nb-search" onclick="openSearch()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    收藏
  </button>

<!-- 搜尋 -->

<div id="sheet" role="dialog" aria-label="選擇日期">
  <div class="sheet-grip"></div>
  <div class="sheet-hd">跳到某一天</div>
  <div id="days"></div>
  <div class="disc">
      <b>使用須知</b>
      本站內容由 PubMed 摘要經 AI 輔助產生，用於<b style="display:inline;font-size:inherit;letter-spacing:0">文獻篩選與教育目的</b>。
      臨床決策前請查閱原文全文、臨床指引與病人個別狀況。
      AI 分析可能有誤，尤其當摘要未提供完整方法與數據時（卡片上的「摘要沒寫」即為此提醒）。
      ARR／NNT 由程式計算，但仍依賴模型正確抽取原始數字。
    </div>
</div>

<script>
const DATA = './data';

let days = [];        // [{date,count}] 新到舊
let startIdx = 0;     // 這次從第幾天開始載
let loaded = 0;       // 已載到第幾天
let papers = [];
let loading = false, done = false, sheetOpen = false;

const WEAK = ['回溯性研究','病例系列','綜述','其他'];

/* ─────────── 啟動 ─────────── */
async function boot(){
  try{
    const r = await fetch(`${DATA}/index.json?v=${Date.now()}`);
    if(!r.ok) throw 0;
    days = await r.json();
    if(!days.length){
      state('還沒有資料','到 GitHub Actions 觸發「每日文獻收集」或「回補歷史文獻」。');
      return;
    }
    renderDays();
    await startFrom(0);
  }catch{
    state('連不上資料','確認 data/index.json 已推上 GitHub Pages。');
  }
  setTimeout(()=>document.getElementById('boot').classList.add('gone'), 650);

  // 首屏畫完之後才在背景載搜尋索引，不擋開場
  setTimeout(loadIndex, 800);
}

/* ─────────── 從第 n 天開始（日期跳轉用） ─────────── */
async function startFrom(n){
  startIdx = n;
  loaded = n;
  papers = [];
  done = false;
  active = 0;
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div id="sentinel"></div>';
  await loadMore();
  await loadMore();
  setupSentinel();
  feed.scrollTop = 0;
  renderDays();
}

/* ─────────── 逐日載入 ─────────── */
async function loadMore(){
  if(loading || done) return;
  if(loaded >= days.length){ done = true; showEnd(); return; }

  loading = true;
  const d = days[loaded];
  try{
    const r = await fetch(`${DATA}/${d.date}.json?v=${Date.now()}`);
    if(r.ok){
      const data = await r.json();
      const batch = (data.papers||[]).map(p=>({...p, _date:d.date, _gen:data.generated_at}));
      if(batch.length){
        const s = papers.length;
        papers = papers.concat(batch);
        appendCards(batch, s);
      }
    }
  }catch{}
  loaded++;
  loading = false;

  if(papers.length === 0 && loaded < days.length) await loadMore();
}

function appendCards(batch, start){
  const html = batch.map((p,i)=>{
    const prev = papers[start + i - 1];
    return card(p, start + i, !prev || prev._date !== p._date);
  }).join('');
  const s = document.getElementById('sentinel');
  if(s) s.insertAdjacentHTML('beforebegin', html);
  syncPager();
  computeActive();
}

function setupSentinel(){
  const feed = document.getElementById('feed');
  const s = document.getElementById('sentinel');
  if(!s) return;
  new IntersectionObserver(es=>{
    if(es[0].isIntersecting) loadMore();
  },{root:feed, rootMargin:'700px'}).observe(s);
}

function showEnd(){
  const s = document.getElementById('sentinel');
  if(s && !s.dataset.done){
    s.dataset.done = '1';
    const nDays = days.length - startIdx;
    s.innerHTML = `<div class="tail">
      <div class="tail-dot"></div>
      <p>已經到最早的文獻了</p>
      <p class="tail-sub">共 ${papers.length} 篇 · ${nDays} 天</p>
      <div class="disc" style="max-width:min(92vw,520px);margin-top:22px;text-align:left">
        <b>使用須知</b>
        本站內容由 PubMed 摘要經 AI 輔助產生，用於文獻篩選與教育目的。
        臨床決策前請查閱原文全文、臨床指引與病人個別狀況。
        AI 分析可能有誤，尤其當摘要未提供完整方法與數據時。
      </div>
    </div>`;
  }
}

/* ─────────── 卡片 ─────────── */
function card(p, i, newDay){
  const zh = p.title_zh || p.title;
  const en = p.title_zh ? p.title : '';
  const ev = p.evidence_level || '';
  const weak = WEAK.includes(ev);
  const jif = (typeof p.impact_factor === 'number') ? p.impact_factor : null;
  const score = (typeof p.score === 'number') ? p.score : null;
  const rel = p.relevance || '', nov = p.novelty || '';
  const one = p.one_liner || '', act = p.action || '';
  const nums = Array.isArray(p.key_numbers) ? p.key_numbers : [];
  const caut = Array.isArray(p.cautions) ? p.cautions : [];
  const unass = Array.isArray(p.unassessable) ? p.unassessable : [];
  const pico = p.pico || {}, abs = p.abstract_zh || '';
  const addedLabel = fmtAdded(p.added_at || p._gen);
  const related = Array.isArray(p.related) ? p.related : [];
  const verdict = p.context_verdict || '';
  const ctx = (p.context && p.context !== '無相關前作') ? p.context : '';
  const tr = tier(p);
  const effects = Array.isArray(p.effects) ? p.effects : [];

  const who = p.authors
    ? p.authors.split(',').slice(0,2).join(',').trim() + (p.authors.split(',').length>2?' et al.':'')
    : '';
  const when = [p.year,p.month].filter(Boolean).join(' ');
  const legacy = !one && Array.isArray(p.key_points);

  const picoRows = ['P','I','C','O'].filter(k=>pico[k])
    .map(k=>`<tr><th>${k}</th><td>${esc(pico[k])}</td></tr>`).join('');

  return `
<article class="card t-${tr}" data-i="${i}" data-date="${p._date}" data-pmid="${p.pmid}">
  <header class="hdr">
    <div class="brand">腸嚐<em>新知</em></div>
    <div class="hdr-r">
      ${!seen.has(p.pmid) ? '<span class="unread" title="未讀"></span>' : ''}
      ${newDay ? '<span class="newday">新的一天</span>' : ''}
      <span class="hdr-date">${fmtDay(p._date)}</span>
    </div>
  </header>

  <div class="body">
    <div class="chips">
      ${tr === 'must' ? `<span class="chip chip-must" title="${esc(mustWhy(p))}">★ 必讀</span>` : ''}
      ${(p.watched && p.watched.length) ? `<span class="chip chip-watch" title="命中追蹤：${esc(p.watched.join('、'))}">🔖 追蹤</span>` : ''}
      ${ev ? `<span class="chip chip-ev ${weak?'weak':''}">${esc(ev)}</span>` : ''}
      ${score!==null ? `<span class="chip chip-score ${scoreClass(score)}">評分 ${score}<i>/10</i></span>` : ''}

/* ═══════════════ 這篇該不該花時間？ ═══════════════
   決定卡片底色。順序有意義 —— 先判「必讀」，再判「可略過」。 */
function tier(p){
  const sc  = (typeof p.score === 'number') ? p.score : null;
  const rel = p.relevance || '';
  const watched     = Array.isArray(p.watched) && p.watched.length > 0;
  const contradicts = p.context_verdict === '與前作矛盾';

  // 🌹 必讀
  if(watched)      return 'must';   // 你在追的主題 —— 分數再低也要看
  if(contradicts)  return 'must';   // 跟你已知的打架 —— 這種最該注意
  if(sc !== null && sc >= 8 && rel === '高度相關') return 'must';
  if(p.novelty === '可能改變實務' && sc !== null && sc >= 7) return 'must';

  // ⬜ 可略過
  if(rel === '低度相關') return 'low';
  if(sc !== null && sc <= 3) return 'low';

  // 🩵 其餘＝相關
  return 'rel';
}

/* 為什麼是必讀？講清楚，不要讓顏色變成謎。 */
function mustWhy(p){
  if(Array.isArray(p.watched) && p.watched.length) return '命中追蹤：' + p.watched.join('、');
  if(p.context_verdict === '與前作矛盾') return '跟你之前看過的論文結論矛盾';
  if(p.novelty === '可能改變實務') return '可能改變臨床實務';
  return '高分且高度相關';
}

function scoreClass(n){ return n>=8?'hi' : n>=6?'mid' : 'lo'; }
function verdictClass(v){
  if(v === '與前作矛盾') return 'diff';   // 最該注意的
  if(v === '再確認')     return 'same';
  if(v === '延伸前作')   return 'ext';
  return 'none';
}
function relClass(r){ return r==='高度相關'?'hi' : r==='低度相關'?'lo' : 'mid'; }
function novClass(n){
  return n==='可能改變實務'?'hi' : n==='仍屬早期'?'early' : n==='結果為陰性'?'neg' : 'mid';
}

function legacyBody(p,i){
  const pts = Array.isArray(p.key_points)?p.key_points:[];
  return `
    ${p.abstract_zh?`<section class="sec"><div class="eyebrow">摘要</div><p class="prose">${esc(p.abstract_zh)}</p></section>`:''}
    ${pts.length?`<section class="sec"><div class="eyebrow">重點</div><ul class="points">${pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}

}

/* ─────────── 工具 ─────────── */
function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDay(d){
  if(!d) return '';
  const [,m,day] = d.split('-');
  return `${+m}月${+day}日`;
}

/* 收錄時間。後端存的是帶 +08:00 時區的 ISO 字串，
   new Date() 會自動轉成使用者的本地時間。 */
function fmtAdded(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';

  const midnight = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((midnight(new Date()) - midnight(d)) / 86400000);
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

  if(days < 0)  return `${d.getMonth()+1}/${d.getDate()}`;   // 時鐘沒對準之類的
  if(days === 0) return `今天 ${hm}`;
  if(days === 1) return `昨天 ${hm}`;
  if(days < 7)   return `${days} 天前`;
  if(days < 30)  return `${Math.floor(days/7)} 週前`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ═══════════════ 本機狀態（localStorage，不需要後端） ═══════════════ */
const LS = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
};

/* cc_star 舊格式是 ["pmid", ...]，新格式是 {pmid: {t,j,d,f,s,w}}。
   兩種都讀得進來 —— 加欄位一定要同時寫遷移，這個教訓學過一次了。 */
const _rawStar = LS.get('cc_star', {});
let starMeta = Array.isArray(_rawStar)
  ? Object.fromEntries(_rawStar.map(pm => [pm, null]))   // 舊資料只有 pmid，標題等等要去索引補
  : (_rawStar || {});
let starred = new Set(Object.keys(starMeta));
let seen    = new Set(LS.get('cc_seen', []));

function saveStar(){ LS.set('cc_star', starMeta); }
function saveSeen(){ LS.set('cc_seen', [...seen]); }

function toggleStar(pmid, el){
  if(starred.has(pmid)){
    starred.delete(pmid); delete starMeta[pmid]; el.classList.remove('on');
  }else{
    starred.add(pmid);
    // 收藏的當下就把要顯示的東西存起來。
    // 之前只存 pmid、看的時候再去 search.json 撈 —— 索引缺一天，收藏就空一片。
    const p = papers.find(x => x.pmid === pmid);
    starMeta[pmid] = p ? {
      t: p.title_zh || p.title || '',
      j: p.journal || '',
      d: p._date || '',
      f: (typeof p.impact_factor === 'number') ? p.impact_factor : null,
      s: (typeof p.score === 'number') ? p.score : null,
      w: p.watched || [],
    } : null;
    el.classList.add('on');
  }
  saveStar();
  updateBadges();
}

function markSeen(pmid){
  if(!pmid || seen.has(pmid)) return;
  seen.add(pmid);
  saveSeen();
  const dot = document.querySelector(`.card[data-pmid="${pmid}"] .unread`);
  if(dot) dot.remove();
  updateBadges();
}

/* ═══════════════ 搜尋索引（開場後才在背景載，不擋首屏） ═══════════════ */
let INDEX = null, indexLoading = null;

function loadIndex(){
  if(INDEX) return Promise.resolve(INDEX);
  if(indexLoading) return indexLoading;
  indexLoading = fetch(`${DATA}/search.json?v=${Date.now()}`)
    .then(r => r.ok ? r.json() : [])
    .then(j => { INDEX = j; updateBadges(); return INDEX; })
    .catch(() => { INDEX = []; return INDEX; });
  return indexLoading;
}

function updateBadges(){
  const b = document.getElementById('nb-badge');
  if(!b) return;
  if(!INDEX){ b.innerHTML = ''; return; }
  const unread = INDEX.filter(x => !seen.has(x.p)).length;
  b.innerHTML = unread ? `<span class="badge">${unread > 99 ? '99+' : unread}</span>` : '';
}

async function openSearch(){
  openPanel('search-panel');
  await loadIndex();
  const q = document.getElementById('q');
  q.focus();
  runSearch();

async function openStars(){
  openPanel('star-panel');
  const note = document.getElementById('s-note');
  const hits = document.getElementById('s-hits');

  const pmids = [...starred];
  // 只有「舊版收藏」（當初只存了 pmid）才需要動用 search.json。
  const needIdx = pmids.some(pm => !starMeta[pm]);
  const idx = needIdx ? await loadIndex() : [];

  const list = pmids.map(pm => {
    const m = starMeta[pm];
    if(m) return {p: pm, d: m.d, t: m.t, j: m.j, f: m.f, s: m.s, w: m.w || [], a: ''};
    return idx.find(y => y.p === pm) || null;   // 索引也沒有 → 只能跳過
  }).filter(Boolean).sort((a, b) => (b.d || '').localeCompare(a.d || ''));

  const missing = pmids.length - list.length;
  note.textContent = list.length
    ? `${list.length} 篇${missing ? `（另有 ${missing} 篇舊收藏在索引裡找不到）` : ''}`
    : '';
  hits.innerHTML = list.length
    ? list.map(hitRow).join('')
    : emptyHint('⭐', '還沒有收藏<br>在論文卡片上按星號，就會存進這裡');
}

/* ═══════════════ 搜尋 ═══════════════ */
function runSearch(){
  const raw = document.getElementById('q').value.trim().toLowerCase();
  const note = document.getElementById('q-note');
  const hits = document.getElementById('q-hits');

  if(!INDEX){ note.textContent = '載入中…'; return; }

  if(raw.length < 1){
    note.textContent = `共 ${INDEX.length} 篇可搜尋`;
    hits.innerHTML = emptyHint('🔍', '搜尋標題、摘要、關鍵數據、期刊<br>例：<code>TaTME</code>、<code>吻合口洩漏</code>、<code>NNT</code>');
    return;
  }

  // 空白分隔 = AND（每個詞都要命中）
  const terms = raw.split(/\s+/).filter(Boolean);
  const found = INDEX.filter(x => terms.every(t => x.x.includes(t)));

  note.textContent = found.length
    ? `找到 ${found.length} 篇`
    : `沒有符合「${raw}」的論文`;

  hits.innerHTML = found.length
    ? found.slice(0, 200).map(hitRow).join('')
      + (found.length > 200 ? '<div class="panel-note">（只顯示前 200 筆）</div>' : '')
    : emptyHint('🤷', '換個關鍵字試試<br>中英文都可以搜');
}

/* 搜尋結果用同一套顏色語言 —— 不然系統會自相矛盾 */
function hitTier(x){
  if(x.w && x.w.length) return 'must';
  if(typeof x.s === 'number' && x.s >= 8) return 'must';
  if(typeof x.s === 'number' && x.s <= 3) return 'low';
  return 'rel';
}

function hitRow(x){
  const sc = (typeof x.s === 'number') ? x.s : null;
  const cls = sc === null ? 'na' : (sc >= 8 ? 'hi' : sc >= 6 ? 'mid' : 'lo');
  const ht = hitTier(x);
  const meta = [
    x.j || '',
    (typeof x.f === 'number') ? `IF ${x.f}` : '',
    x.d ? fmtDay(x.d) : '',
  ].filter(Boolean);

  return `
<button class="hit h-${ht}" onclick="openPaper('${x.p}','${x.d}')">
  <span class="hit-s ${cls}">${sc === null ? '–' : sc}</span>
  <span class="hit-b">
    <span class="hit-t">${esc(x.t)}</span>
    <span class="hit-m">
      ${meta.map(m => `<span>${esc(m)}</span>`).join('<span>·</span>')}
      ${(x.w && x.w.length) ? '<span class="w">🔖 追蹤</span>' : ''}
      ${!seen.has(x.p) ? '<span style="color:#D94F86">● 未讀</span>' : ''}
    </span>
  </span>
  ${starred.has(x.p) ? '<span class="hit-star"><svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg></span>' : ''}
</button>`;
}

function emptyHint(icon, html){
  return `<div class="empty-hint"><div class="big">${icon}</div><p>${html}</p></div>`;
}

/* 從搜尋 / 收藏跳到那一篇 */
async function openPaper(pmid, date){
  closePanel('search-panel');
  closePanel('star-panel');

  const di = days.findIndex(d => d.date === date);
  if(di < 0) return;

  if(startIdx !== di || !papers.some(p => p.pmid === pmid)){
    await startFrom(di);
  }
  const i = papers.findIndex(p => p.pmid === pmid);
  if(i >= 0){
    const c = cards()[i];
    if(c){
      c.scrollIntoView({block:'start'});
      active = i;
      syncPager();
      markSeen(pmid);
    }
  }
}

/* ═══════════════ 翻頁 ═══════════════
   平常滑動 = 一般捲動。要換論文才按鈕（或鍵盤 j/k）。 */
let active = 0;

function cards(){ return [...document.querySelectorAll('.card')]; }

function jump(dir){
  const cs = cards();
  if(!cs.length) return;
  const next = Math.min(Math.max(active + dir, 0), cs.length - 1);
  if(next === active && dir !== 0) return;
  cs[next].scrollIntoView({behavior:'smooth', block:'start'});
  active = next;
  syncPager();
  flashPager();
}

/* 哪一張卡佔畫面最多，就是「當前這篇」。

   本來用 IntersectionObserver，但它的 callback 只會收到「這次跨過閾值」的那幾張卡，
   我在那一小批裡挑最大的 —— 結果自由捲一點點，只有下一張卡觸發回呼，
   它就被誤判成當前頁。改成直接量所有卡的可見高度，簡單而且不會錯。 */
function computeActive(){
  const feed = document.getElementById('feed');
  if(!feed) return;
  const ft = feed.getBoundingClientRect().top;
  const vh = feed.clientHeight;

  let best = -1, bestVis = 0;
  cards().forEach((c, i) => {
    const r = c.getBoundingClientRect();
    const top = r.top - ft;
    const bot = r.bottom - ft;
    const vis = Math.max(0, Math.min(bot, vh) - Math.max(top, 0));   // 這張卡露出多少 px
    if(vis > bestVis){ bestVis = vis; best = i; }
  });

  if(best >= 0 && best !== active){
    active = best;
    syncPager();
  }

  // 停在同一篇超過 1.2 秒才算「讀過」，只是快速滑過去不算
  clearTimeout(computeActive._t);
  computeActive._t = setTimeout(()=>{
    const p = papers[active];
    if(p) markSeen(p.pmid);
  }, 1200);
}

/* 捲動時用 rAF 節流，不要每個 scroll event 都算 */
let rafPending = false;
function onScroll(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending = false; computeActive(); });
}

function syncPager(){
  const n = cards().length;
  const pos = document.getElementById('pg-pos');
  if(pos) pos.innerHTML = `<b>${n ? active+1 : 0}</b>／${n}`;
  const up = document.getElementById('pg-up');
  const dn = document.getElementById('pg-dn');
  if(up) up.disabled = active <= 0;
  if(dn) dn.disabled = active >= n - 1;
}

/* 按下去時讓翻頁鈕短暫變清楚，給一點回饋 */
function flashPager(){
  const p = document.getElementById('pager');
  if(!p) return;
  p.classList.add('active');
  clearTimeout(flashPager._t);
  flashPager._t = setTimeout(()=>p.classList.remove('active'), 900);
}

addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); jump(1); }
  if(e.key==='ArrowUp'  ||e.key==='k'){ e.preventDefault(); jump(-1); }
  if(e.key==='Escape'){
    closePanel('search-panel');
    closePanel('star-panel');
    if(sheetOpen) toggleSheet(false);
  }
  if((e.key==='/' || (e.key==='k' && (e.metaKey||e.ctrlKey))) && !document.querySelector('.panel.open')){
    e.preventDefault(); openSearch();
  }
});
document.getElementById('feed').addEventListener('touchstart', ()=>{
  if(sheetOpen) toggleSheet(false);
}, {passive:true});

document.getElementById('feed').addEventListener('scroll', onScroll, {passive:true});
addEventListener('resize', ()=>{ computeActive(); }, {passive:true});

if('serviceWorker' in navigator){
  addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

boot();
</script>
