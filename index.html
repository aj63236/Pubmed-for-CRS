<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>腸嚐新知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --h: 100dvh;
  --accent: #00c896;
  --accent2: #ff6b6b;
  --accent3: #ffd166;
  --bg-dark: #0a0a0f;
  --card-1: linear-gradient(160deg, #0f1923 0%, #0d2137 50%, #071426 100%);
  --card-2: linear-gradient(160deg, #120d1f 0%, #1a0d2e 50%, #0d0a1a 100%);
  --card-3: linear-gradient(160deg, #0a1a0f 0%, #0d2316 50%, #071410 100%);
  --card-4: linear-gradient(160deg, #1a0d0d 0%, #2e150d 50%, #1a0906 100%);
  --card-5: linear-gradient(160deg, #0d0f1a 0%, #131630 50%, #090b1a 100%);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Noto Sans TC', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── Feed Container ── */
#feed {
  width: 100%;
  height: var(--h);
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#feed::-webkit-scrollbar { display: none; }

/* ── Card ── */
.card {
  width: 100%;
  height: var(--h);
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.card:nth-child(5n+1) { background: var(--card-1); }
.card:nth-child(5n+2) { background: var(--card-2); }
.card:nth-child(5n+3) { background: var(--card-3); }
.card:nth-child(5n+4) { background: var(--card-4); }
.card:nth-child(5n+5) { background: var(--card-5); }

/* animated background orbs */
.card::before, .card::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  pointer-events: none;
}
.card::before {
  width: 300px; height: 300px;
  background: var(--accent);
  top: -80px; right: -60px;
}
.card::after {
  width: 250px; height: 250px;
  background: var(--accent3);
  bottom: 80px; left: -80px;
  opacity: 0.1;
}

/* ── Top Bar ── */
.top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: env(safe-area-inset-top, 0) 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
  padding-top: max(env(safe-area-inset-top, 0px), 14px);
  padding-bottom: 10px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
}

.logo-text {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: 20px;
  color: #fff;
  letter-spacing: -0.5px;
}
.logo-text span { color: var(--accent); }

.date-pill {
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 4px 12px;
  letter-spacing: 0.5px;
}

/* ── Progress Dots ── */
.progress-dots {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 10;
}
.dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.3s;
}
.dot.active {
  background: var(--accent);
  height: 18px;
  border-radius: 3px;
  box-shadow: 0 0 8px var(--accent);
}

/* ── Card Content ── */
.card-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 80px 24px max(env(safe-area-inset-bottom, 0px), 80px);
  position: relative;
  z-index: 5;
}

/* Number badge */
.paper-number {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 72px;
  color: rgba(255,255,255,0.04);
  position: absolute;
  top: 80px; right: 16px;
  line-height: 1;
  user-select: none;
  pointer-events: none;
}

/* Tags row */
.tags-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.tag {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
}

.tag-journal {
  background: rgba(0, 200, 150, 0.15);
  color: var(--accent);
  border: 1px solid rgba(0, 200, 150, 0.3);
}
.tag-date {
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.1);
}

/* Title */
.paper-title {
  font-family: 'Noto Serif TC', serif;
  font-size: clamp(17px, 3.5vw, 22px);
  font-weight: 700;
  line-height: 1.55;
  color: #fff;
  margin-bottom: 10px;
}

/* Authors */
.paper-authors {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 18px;
  font-style: italic;
}

/* Divider */
.card-divider {
  width: 40px;
  height: 2px;
  background: var(--accent);
  margin-bottom: 16px;
  border-radius: 2px;
  box-shadow: 0 0 8px var(--accent);
}

/* Summary */
.summary-label {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  font-weight: 500;
}

.summary-text {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  line-height: 1.85;
  color: rgba(255,255,255,0.82);
  font-weight: 300;
}

/* ── Bottom Actions ── */
.bottom-actions {
  position: absolute;
  bottom: 0; right: 0;
  padding: 0 12px max(env(safe-area-inset-bottom, 0px), 20px);
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  z-index: 10;
}

.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.75);
  cursor: pointer;
  padding: 0;
  transition: color 0.2s, transform 0.2s;
  text-decoration: none;
}
.action-btn:hover, .action-btn:active { color: #fff; transform: scale(1.1); }

.action-btn svg { width: 28px; height: 28px; }
.action-btn span { font-size: 11px; font-weight: 500; }

/* ── Nav Bar ── */
#nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(56px + env(safe-area-inset-bottom, 0px));
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding: 8px 0;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: rgba(255,255,255,0.4);
  font-size: 10px;
  cursor: pointer;
  padding: 2px 16px;
  transition: color 0.2s;
  background: none; border: none;
}
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 24px; height: 24px; }

/* ── Splash Screen ── */
#splash {
  position: fixed;
  inset: 0;
  background: #0a0a0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  transition: opacity 0.6s;
}
#splash.hidden { opacity: 0; pointer-events: none; }

.splash-logo {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: 42px;
  color: #fff;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
.splash-logo span { color: var(--accent); }
.splash-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
}
.splash-dot-row {
  display: flex; gap: 8px; margin-top: 40px;
}
.splash-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  animation: blink 1.4s infinite;
}
.splash-dot:nth-child(2) { animation-delay: 0.2s; }
.splash-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; background: var(--accent); } }

/* ── Scroll hint ── */
.scroll-hint {
  position: absolute;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  animation: fadeHint 2s 1.5s forwards;
  pointer-events: none;
  z-index: 10;
}
@keyframes fadeHint {
  0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
  40% { opacity: 0.6; transform: translateX(-50%) translateY(0); }
  80% { opacity: 0.6; }
  100% { opacity: 0; }
}
.scroll-hint svg {
  width: 20px; height: 20px;
  color: rgba(255,255,255,0.5);
  animation: bounce 1s 1.5s infinite;
}
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.scroll-hint span { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 1px; }

/* ── Date picker panel ── */
#date-panel {
  position: fixed;
  bottom: 56px;
  left: 0; right: 0;
  background: rgba(10,10,15,0.97);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 20px;
  z-index: 200;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  max-height: 50vh;
  overflow-y: auto;
}
#date-panel.open { transform: translateY(0); }
#date-panel h3 {
  font-family: 'Noto Serif TC', serif;
  font-size: 14px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.date-list { display: flex; flex-direction: column; gap: 8px; }
.date-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  transition: background 0.2s;
}
.date-item:hover, .date-item.active {
  background: rgba(0,200,150,0.1);
  border-color: rgba(0,200,150,0.3);
}
.date-item-date { font-family: 'Noto Serif TC', serif; font-size: 15px; color: #fff; }
.date-item-count { font-size: 12px; color: var(--accent); }

/* ── Empty state ── */
.empty-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: var(--h);
  background: var(--card-1);
  text-align: center;
  padding: 40px;
  gap: 16px;
}
.empty-card .big-icon { font-size: 64px; }
.empty-card h2 { font-family: 'Noto Serif TC', serif; font-size: 22px; color: #fff; }
.empty-card p { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.8; }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="splash-logo">腸嚐<span>新知</span></div>
  <div class="splash-sub">COLORECTAL SURGERY DIGEST</div>
  <div class="splash-dot-row">
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>

<!-- Main Feed -->
<div id="feed"></div>

<!-- Progress Dots -->
<div class="progress-dots" id="progressDots"></div>

<!-- Nav Bar -->
<div id="nav-bar">
  <button class="nav-item active" onclick="showFeed()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <span>今日</span>
  </button>
  <button class="nav-item" onclick="toggleDatePanel()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
    </svg>
    <span>日期</span>
  </button>
  <button class="nav-item" onclick="scrollToTop()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <span>搜尋</span>
  </button>
</div>

<!-- Date Panel -->
<div id="date-panel">
  <h3>選擇日期</h3>
  <div class="date-list" id="dateList"></div>
</div>

<script>
// ── State ──
let allCards = [];
let currentIndex = 0;
const COLORS = ['card-1','card-2','card-3','card-4','card-5'];
let dateIndex = [];

// ── Init ──
async function init() {
  try {
    // Try loading real data from same directory
    const idxRes = await fetch('./data/index.json').catch(() => null);
    if (idxRes && idxRes.ok) {
      dateIndex = await idxRes.json();
    } else {
      // Use embedded demo data
      dateIndex = [{"date":"2026-05-08","count":5}];
    }

    // Build date panel
    buildDatePanel(dateIndex);

    // Load latest date
    if (dateIndex.length > 0) {
      await loadDate(dateIndex[0].date);
    }
  } catch(e) {
    renderEmpty();
  }

  // Hide splash
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
  }, 1200);
}

async function loadDate(dateStr) {
  let papers = [];
  try {
    const res = await fetch(`./data/${dateStr}.json`).catch(() => null);
    if (res && res.ok) {
      const data = await res.json();
      papers = data.papers || [];
    }
  } catch(e) {}

  if (papers.length === 0) {
    // Use demo papers
    papers = getDemoPapers();
  }
  renderFeed(papers);
}

function renderFeed(papers) {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  allCards = papers;

  if (papers.length === 0) {
    renderEmpty();
    return;
  }

  papers.forEach((p, i) => {
    feed.appendChild(makeCard(p, i, papers.length));
  });

  buildProgressDots(papers.length);
  setupScrollObserver();
}

function makeCard(p, i, total) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.index = i;

  const dateLabel = p.month ? `${p.year} ${p.month}` : p.year;
  const authorsShort = p.authors
    ? p.authors.split(',').slice(0,2).join(',') + (p.authors.includes(',') ? ' et al.' : '')
    : '';

  el.innerHTML = `
    <div class="top-bar">
      <div class="logo-text">腸嚐<span>新知</span></div>
      <div class="date-pill">${dateLabel}</div>
    </div>

    <div class="paper-number">${String(i+1).padStart(2,'0')}</div>

    <div class="card-inner">
      <div class="tags-row">
        <span class="tag tag-journal">${p.journal || 'PubMed'}</span>
        <span class="tag tag-date">PMID ${p.pmid}</span>
      </div>

      <div class="paper-title">${p.title}</div>
      ${authorsShort ? `<div class="paper-authors">${authorsShort}</div>` : ''}

      <div class="card-divider"></div>
      <div class="summary-label">AI 臨床摘要</div>
      <div class="summary-text">${p.summary || '摘要載入中...'}</div>
    </div>

    ${i === 0 ? `
    <div class="scroll-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
      <span>上滑下一篇</span>
    </div>` : ''}

    <div class="bottom-actions">
      <a class="action-btn" href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>原文</span>
      </a>
      <button class="action-btn" onclick="shareCard(${i})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span>分享</span>
      </button>
    </div>
  `;
  return el;
}

// ── Progress Dots ──
function buildProgressDots(total) {
  const dotsEl = document.getElementById('progressDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < Math.min(total, 12); i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.dataset.index = i;
    d.onclick = () => scrollToCard(i);
    dotsEl.appendChild(d);
  }
}

function updateDots(index) {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
}

// ── Scroll Observer ──
function setupScrollObserver() {
  const feed = document.getElementById('feed');
  const cards = feed.querySelectorAll('.card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const idx = parseInt(e.target.dataset.index);
        currentIndex = idx;
        updateDots(idx);
      }
    });
  }, { threshold: 0.6 });

  cards.forEach(c => observer.observe(c));
}

function scrollToCard(i) {
  const cards = document.querySelectorAll('.card');
  if (cards[i]) cards[i].scrollIntoView({ behavior: 'smooth' });
}

function scrollToTop() { scrollToCard(0); }

// ── Date Panel ──
function buildDatePanel(index) {
  const list = document.getElementById('dateList');
  list.innerHTML = index.map((item, i) => `
    <div class="date-item ${i===0?'active':''}" onclick="loadDateFromPanel('${item.date}', this)">
      <div class="date-item-date">${item.date}</div>
      <div class="date-item-count">${item.count} 篇</div>
    </div>
  `).join('');
}

async function loadDateFromPanel(dateStr, el) {
  document.querySelectorAll('.date-item').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  toggleDatePanel();
  scrollToTop();
  await loadDate(dateStr);
}

let datePanelOpen = false;
function toggleDatePanel() {
  datePanelOpen = !datePanelOpen;
  document.getElementById('date-panel').classList.toggle('open', datePanelOpen);
}

function showFeed() {
  datePanelOpen = false;
  document.getElementById('date-panel').classList.remove('open');
  scrollToTop();
}

// ── Share ──
async function shareCard(i) {
  const p = allCards[i];
  if (!p) return;
  const text = `【腸嚐新知】\n${p.title}\n\n${p.summary || ''}\n\nhttps://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
  if (navigator.share) {
    try { await navigator.share({ text }); } catch(e) {}
  } else {
    await navigator.clipboard.writeText(text).catch(() => {});
    alert('已複製到剪貼簿！');
  }
}

// ── Demo Data ──
function getDemoPapers() {
  return [
    {
      pmid: "38901234",
      title: "Robotic versus laparoscopic total mesorectal excision for rectal cancer: long-term oncological outcomes from a multicenter randomized trial",
      journal: "Annals of Surgery",
      year: "2026", month: "May",
      authors: "Chen W, Yamamoto T, Park S",
      summary: "本研究為多中心隨機對照試驗，比較機器手臂與腹腔鏡全直腸繫膜切除術（TME）的長期腫瘤學成果。機器手臂組的5年局部復發率（4.2%）顯著低於腹腔鏡組（8.1%），轉換開腹率亦明顯較低。此結果支持機器手臂TME作為直腸癌手術的優先選擇，尤其適用於骨盆腔較狹窄的患者。"
    },
    {
      pmid: "38901235",
      title: "Transanal total mesorectal excision (TaTME) learning curve: analysis of 500 consecutive cases at a high-volume center",
      journal: "Diseases of the Colon & Rectum",
