<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>腸嚐新知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #00c896;
  --accent-dim: rgba(0,200,150,0.13);
  --accent-border: rgba(0,200,150,0.3);
  --gold: #f0b429;
  --blue: #58a6ff;
  --bg: #070b10;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #eef2f7;
  --muted: rgba(255,255,255,0.45);
  --nav-h: 56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}

/* FEED */
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:var(--nav-h)}
#feed::-webkit-scrollbar{display:none}

/* CARD */
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;overflow:hidden}
.card:nth-child(5n+1){background:radial-gradient(ellipse 130% 90% at 80% 10%,#0a2a3a 0%,#040c14 65%)}
.card:nth-child(5n+2){background:radial-gradient(ellipse 130% 90% at 15% 85%,#1a0d2e 0%,#060510 65%)}
.card:nth-child(5n+3){background:radial-gradient(ellipse 130% 90% at 75% 25%,#0d2a15 0%,#040e08 65%)}
.card:nth-child(5n+4){background:radial-gradient(ellipse 130% 90% at 25% 75%,#2a150a 0%,#100604 65%)}
.card:nth-child(5n+5){background:radial-gradient(ellipse 130% 90% at 65% 35%,#0d1a30 0%,#050810 65%)}
.card::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:var(--accent);opacity:.055;filter:blur(85px);top:-50px;right:-50px;pointer-events:none}

/* TOP BAR */
.top-bar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:max(env(safe-area-inset-top,0px),16px) 20px 12px;background:linear-gradient(to bottom,rgba(4,8,14,.88) 0%,transparent 100%)}
.logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:19px;color:#fff;display:flex;align-items:center;gap:2px}
.logo-accent{color:var(--accent)}
.logo-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);margin-left:5px;animation:blink 2s infinite}
@keyframes blink{0%,80%,100%{opacity:1}40%{opacity:.25}}
.counter{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px}

/* SCROLL AREA */
.card-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:68px 20px 76px;display:flex;flex-direction:column;gap:0}
.card-scroll::-webkit-scrollbar{display:none}

/* BIG NUMBER WATERMARK */
.paper-num{font-family:'DM Serif Display',serif;font-style:italic;font-size:100px;color:rgba(255,255,255,.028);line-height:1;position:absolute;top:50px;right:10px;pointer-events:none;user-select:none}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tag{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:4px 11px;border-radius:20px}
.tag-j{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border)}
.tag-d{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}

/* TITLE */
.title-en{font-family:'Noto Serif TC',serif;font-size:clamp(13px,2.8vw,16px);font-weight:400;line-height:1.65;color:rgba(255,255,255,.55);margin-bottom:8px;font-style:italic}
.title-placeholder{font-family:'Noto Serif TC',serif;font-size:clamp(15px,3.2vw,19px);font-weight:700;line-height:1.7;color:#fff;margin-bottom:6px}
.authors{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:20px}

/* SECTION BLOCKS */
.section{background:rgba(255,255,255,.04);border-radius:14px;padding:16px 16px 16px 20px;margin-bottom:12px;border:1px solid var(--border);position:relative;overflow:hidden}
.section::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.sec-blue::before{background:var(--blue)}
.sec-green::before{background:var(--accent)}
.sec-gold::before{background:var(--gold)}
.sec-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-blue .sec-label{color:var(--blue)}
.sec-green .sec-label{color:var(--accent)}
.sec-gold .sec-label{color:var(--gold)}
.sec-text{font-size:13.5px;line-height:1.95;color:rgba(255,255,255,.83);font-weight:300}

/* LOADING SHIMMER */
.shimmer{height:13px;background:rgba(255,255,255,.07);border-radius:6px;margin-bottom:9px;animation:shim 1.5s infinite}
.shimmer.s80{width:80%}.shimmer.s65{width:65%}
@keyframes shim{0%,100%{opacity:.5}50%{opacity:1}}

/* ACTIONS */
.card-actions{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--border);margin-top:2px;flex-wrap:wrap}
.action-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;padding:7px 14px;border-radius:20px;border:1px solid var(--accent-border);background:var(--accent-dim);transition:all .2s}
.action-link:hover{background:rgba(0,200,150,.25)}
.share-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;font-family:inherit}
.share-btn:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.pmid-label{margin-left:auto;font-family:monospace;font-size:10px;color:rgba(255,255,255,.18)}

/* SCROLL HINT */
.scroll-hint{position:absolute;bottom:calc(var(--nav-h)+14px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;animation:hintFade 3.5s 2.5s forwards;opacity:0;z-index:10}
@keyframes hintFade{0%{opacity:0;transform:translateX(-50%) translateY(6px)}20%{opacity:.6;transform:translateX(-50%) translateY(0)}80%{opacity:.6}100%{opacity:0}}
.scroll-hint svg{width:18px;height:18px;color:rgba(255,255,255,.4);animation:bounce 1s 2.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.scroll-hint span{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:rgba(4,8,14,.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.32);font-size:10px;font-weight:500;cursor:pointer;padding:2px 20px;background:none;border:none;font-family:inherit;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}

/* DATE SHEET */
#date-sheet{position:fixed;bottom:var(--nav-h);left:0;right:0;background:#0c1420;border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px;z-index:90;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:55vh;overflow-y:auto}
#date-sheet.open{transform:translateY(0)}
#date-sheet h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;text-align:center}
.date-item{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;background:var(--surface);transition:all .2s}
.date-item:hover,.date-item.active{background:var(--accent-dim);border-color:var(--accent-border)}
.date-item-l{font-family:'Noto Serif TC',serif;font-size:15px}
.date-item-r{font-size:12px;color:var(--accent)}

/* API KEY MODAL */
#key-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:500;padding:24px}
#key-modal.hidden{display:none}
.key-box{background:#0c1420;border:1px solid var(--border);border-radius:18px;padding:28px 24px;width:100%;max-width:420px}
.key-box h2{font-family:'Noto Serif TC',serif;font-size:20px;margin-bottom:6px}
.key-box p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.key-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-family:monospace;font-size:13px;margin-bottom:12px}
.key-input:focus{outline:none;border-color:var(--accent)}
.key-save{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.key-save:hover{background:#00e0a8}
.key-note{font-size:11px;color:rgba(255,255,255,.25);text-align:center;margin-top:10px;line-height:1.6}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.splash-logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:46px;color:#fff;letter-spacing:-1px}
.splash-logo span{color:var(--accent)}
.splash-sub{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:6px}
.splash-dots{display:flex;gap:8px;margin-top:40px}
.splash-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);animation:sdot 1.4s infinite}
.splash-dot:nth-child(2){animation-delay:.2s}
.splash-dot:nth-child(3){animation-delay:.4s}
@keyframes sdot{0%,80%,100%{opacity:.2}40%{opacity:1;background:var(--accent)}}

/* EMPTY */
.empty{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:14px}
.empty .icon{font-size:52px}
.empty h2{font-family:'Noto Serif TC',serif;font-size:20px}
.empty p{font-size:13px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="splash-logo">腸嚐<span>新知</span></div>
  <div class="splash-sub">COLORECTAL SURGERY DIGEST</div>
  <div class="splash-dots"><div class="splash-dot"></div><div class="splash-dot"></div><div class="splash-dot"></div></div>
</div>

<!-- API Key Modal -->
<div id="key-modal">
  <div class="key-box">
    <h2>輸入 Claude API Key</h2>
    <p>用來即時產生中文翻譯與臨床摘要。Key 只儲存在你自己的瀏覽器，不會上傳到任何地方。</p>
    <input class="key-input" id="key-input" type="password" placeholder="sk-ant-api03-..." />
    <button class="key-save" onclick="saveKey()">儲存並開始</button>
    <div class="key-note">可在右下角「設定」隨時更換 Key</div>
  </div>
</div>

<!-- Feed -->
<div id="feed"></div>

<!-- Nav -->
<div id="nav">
  <button class="nav-btn active" id="nav-home" onclick="navHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    今日
  </button>
  <button class="nav-btn" id="nav-cal" onclick="toggleSheet()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    日期
  </button>
  <button class="nav-btn" id="nav-top" onclick="scrollTop()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
    回頂
  </button>
  <button class="nav-btn" onclick="changeKey()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    設定
  </button>
</div>

<!-- Date Sheet -->
<div id="date-sheet">
  <h3>選擇日期</h3>
  <div id="date-list"></div>
</div>

<script>
const GITHUB_USER = 'aj63236';
const REPO_NAME   = 'Pubmed-for-CRS';
const BASE        = `https://${GITHUB_USER}.github.io/${REPO_NAME}`;

let papers = [];
let dateIndex = [];
let sheetVisible = false;
let currentDate = '';
let apiKey = localStorage.getItem('cc_api_key') || '';
let summaryCache = {}; // cache: pmid -> {abstract, summary, impact}

// ── Key Management ───────────────────────────────────
function saveKey() {
  const v = document.getElementById('key-input').value.trim();
  if (!v.startsWith('sk-ant')) { alert('請輸入正確的 Claude API Key（以 sk-ant 開頭）'); return; }
  apiKey = v;
  localStorage.setItem('cc_api_key', v);
  document.getElementById('key-modal').classList.add('hidden');
  init();
}

function changeKey() {
  document.getElementById('key-input').value = apiKey;
  document.getElementById('key-modal').classList.remove('hidden');
}

// ── Init ─────────────────────────────────────────────
async function init() {
  if (!apiKey) { document.getElementById('key-modal').classList.remove('hidden'); return; }
  document.getElementById('key-modal').classList.add('hidden');

  try {
    const r = await fetch(`${BASE}/data/index.json?_=${Date.now()}`);
    if (!r.ok) throw new Error();
    dateIndex = await r.json();
    buildDateList();
    if (dateIndex.length > 0) await loadDate(dateIndex[0].date);
    else showEmpty('尚無資料，請先執行收集腳本');
  } catch(e) {
    useDemoData();
  }
  setTimeout(() => document.getElementById('splash').classList.add('out'), 1000);
}

// ── Load Date ─────────────────────────────────────────
async function loadDate(date) {
  currentDate = date;
  document.querySelectorAll('.date-item').forEach(el =>
    el.classList.toggle('active', el.dataset.date === date));
  try {
    const r = await fetch(`${BASE}/data/${date}.json?_=${Date.now()}`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    papers = data.papers || [];
  } catch {
    papers = [];
  }
  renderFeed(papers, date);
  // Generate summaries sequentially
  for (let i = 0; i < papers.length; i++) {
    await generateAndUpdate(papers[i], i);
  }
}

// ── Render Feed ───────────────────────────────────────
function renderFeed(list, date) {
  const feed = document.getElementById('feed');
  if (!list.length) { showEmpty('本日無新文獻'); return; }
  feed.innerHTML = list.map((p, i) => cardHTML(p, i, list.length)).join('');
}

function cardHTML(p, i, total) {
  const auth = p.authors
    ? p.authors.split(',').slice(0,3).join(', ') + (p.authors.split(',').length > 3 ? ' et al.' : '')
    : '';
  const dateLabel = p.month ? `${p.year} ${p.month}` : (p.year || currentDate);
  const cached = summaryCache[p.pmid] || {};

  return `
<div class="card">
  <div class="paper-num">${String(i+1).padStart(2,'0')}</div>
  <div class="top-bar">
    <div class="logo">腸嚐<span class="logo-accent">新知</span><span class="logo-dot"></span></div>
    <div class="counter">${i+1} / ${total}</div>
  </div>
  <div class="card-scroll">
    <div class="tags">
      <span class="tag tag-j">${p.journal || 'PubMed'}</span>
      <span class="tag tag-d">${dateLabel}</span>
    </div>
    <div class="title-en">${p.title}</div>
    ${auth ? `<div class="authors">${auth}</div>` : ''}

    <div class="section sec-blue" id="abs-${p.pmid}">
      <div class="sec-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        完整中文摘要
      </div>
      <div class="sec-text">${cached.abstract || shimmer()}</div>
    </div>

    <div class="section sec-green" id="sum-${p.pmid}">
      <div class="sec-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        臨床重點摘要
      </div>
      <div class="sec-text">${cached.summary || shimmer()}</div>
    </div>

    <div class="section sec-gold" id="imp-${p.pmid}">
      <div class="sec-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        對臨床的影響
      </div>
      <div class="sec-text">${cached.impact || shimmer()}</div>
    </div>

    <div class="card-actions">
      ${p.pmid ? `<a class="action-link" href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        原文
      </a>` : ''}
      <button class="share-btn" onclick="shareCard(${i})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        分享
      </button>
      ${p.pmid ? `<span class="pmid-label">PMID ${p.pmid}</span>` : ''}
    </div>
  </div>
  ${i === 0 ? `<div class="scroll-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    <span>上滑下一篇</span>
  </div>` : ''}
</div>`;
}

function shimmer() {
  return `<div class="shimmer"></div><div class="shimmer s80"></div><div class="shimmer s65"></div>`;
}

// ── AI Summary (browser-side) ─────────────────────────
const PROMPT = `你是大腸直腸外科資深主治醫師。請針對以下英文醫學論文，用繁體中文輸出三個段落，每段用標記開頭，直接輸出內容不需前言：

【完整中文摘要】將原文摘要完整翻譯成繁體中文，不縮減任何內容，保留所有數據與細節。
【臨床重點摘要】用3-4句話整理最重要的發現，包含具體數字與統計結果。
【對臨床的影響】用2-3句話說明此研究如何改變臨床實務，對哪類患者最重要，有何行動意義。

論文標題：{title}
期刊：{journal}
原文摘要：{abstract}`;

async function generateAndUpdate(paper, idx) {
  const pmid = paper.pmid;
  if (summaryCache[pmid]) {
    updateCard(pmid, summaryCache[pmid]);
    return;
  }
  if (!apiKey) return;

  const prompt = PROMPT
    .replace('{title}', paper.title)
    .replace('{journal}', paper.journal || '')
    .replace('{abstract}', (paper.abstract || paper.summary || '').slice(0, 2500));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 900,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err?.error?.message || `HTTP ${res.status}`;
      if (res.status === 401 || res.status === 403 || (msg && msg.includes('API key'))) {
        apiKey = '';
        localStorage.removeItem('cc_api_key');
        document.getElementById('key-input').value = '';
        document.getElementById('key-modal').classList.remove('hidden');
        updateCard(pmid, { abstract: '⚠️ API Key 無效，請重新輸入後重新整理頁面', summary: '', impact: '' });
      } else {
        updateCard(pmid, { abstract: `⚠️ API 錯誤：${msg}`, summary: '', impact: '' });
      }
      return;
    }

    const data = await res.json();
    const raw = data.content?.[0]?.text || '';
    const parsed = parseSections(raw);
    summaryCache[pmid] = parsed;
    updateCard(pmid, parsed);
  } catch(e) {
    updateCard(pmid, { abstract: `⚠️ 網路錯誤：${e.message}`, summary: '', impact: '' });
  }
}

function parseSections(raw) {
  const absMatch = raw.match(/【完整中文摘要】([\s\S]*?)(?=【|$)/);
  const sumMatch = raw.match(/【臨床重點摘要】([\s\S]*?)(?=【|$)/);
  const impMatch = raw.match(/【對臨床的影響】([\s\S]*?)(?=【|$)/);
  return {
    abstract: (absMatch?.[1] || '').trim(),
    summary:  (sumMatch?.[1] || '').trim(),
    impact:   (impMatch?.[1] || raw).trim(),
  };
}

function updateCard(pmid, sections) {
  const absEl = document.getElementById(`abs-${pmid}`);
  const sumEl = document.getElementById(`sum-${pmid}`);
  const impEl = document.getElementById(`imp-${pmid}`);
  if (absEl) absEl.querySelector('.sec-text').innerHTML = sections.abstract || '—';
  if (sumEl) sumEl.querySelector('.sec-text').innerHTML = sections.summary || '—';
  if (impEl) impEl.querySelector('.sec-text').innerHTML = sections.impact || '—';
}

// ── Date Sheet ────────────────────────────────────────
function buildDateList() {
  document.getElementById('date-list').innerHTML = dateIndex.map(e => `
    <div class="date-item ${e.date === currentDate ? 'active' : ''}" data-date="${e.date}" onclick="selectDate('${e.date}')">
      <span class="date-item-l">${e.date}</span>
      <span class="date-item-r">${e.count} 篇</span>
    </div>`).join('');
}

async function selectDate(date) {
  toggleSheet(false); scrollTop();
  await loadDate(date);
  buildDateList();
}

function toggleSheet(force) {
  sheetVisible = typeof force === 'boolean' ? force : !sheetVisible;
  document.getElementById('date-sheet').classList.toggle('open', sheetVisible);
  document.getElementById('nav-cal').classList.toggle('active', sheetVisible);
  document.getElementById('nav-home').classList.toggle('active', !sheetVisible);
}

function navHome() { toggleSheet(false); scrollTop(); }
function scrollTop() { document.getElementById('feed').scrollTo({ top: 0, behavior: 'smooth' }); }

// ── Share ─────────────────────────────────────────────
async function shareCard(i) {
  const p = papers[i]; if (!p) return;
  const cached = summaryCache[p.pmid] || {};
  const text = `【腸嚐新知】\n${p.title}\n\n${cached.summary || ''}\n\nhttps://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
  if (navigator.share) { try { await navigator.share({ text }); } catch {} }
  else { await navigator.clipboard.writeText(text).catch(() => {}); alert('已複製！'); }
}

// ── Helpers ───────────────────────────────────────────
function showEmpty(msg) {
  document.getElementById('feed').innerHTML = `
    <div class="empty"><div class="icon">📭</div><h2>暫無文獻</h2><p>${msg}</p></div>`;
  document.getElementById('splash').classList.add('out');
}
