<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>腸嚐新知 · 大腸直腸外科文獻</title>
<meta name="description" content="每日 PubMed 大腸直腸外科新文獻，中文摘要與臨床重點">

<!-- PWA：可加到 iPhone 主畫面當 App 用 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="腸嚐新知">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ═══════════════ TOKENS ═══════════════
   Palette: 手術燈下的視野
   ink     深板岩藍   底色，不是純黑（純黑在 OLED 上刺眼）
   drape   手術鋪單青  主色，來自 surgical drape 的那個綠
   bone    骨白       中文內文用色，像底片上的字，不是螢光白
   film    冷灰       次要資訊
   flag    琥珀       臨床意義（唯一暖色，用得很省）
*/
:root{
  --ink-900:#070d10;
  --ink-800:#0b1418;
  --ink-700:#111d23;
  --ink-600:#18272f;
  --line:rgba(150,190,200,.14);
  --line-soft:rgba(150,190,200,.08);

  --drape:#3fd2ac;
  --drape-deep:#1a8f75;
  --drape-wash:rgba(63,210,172,.10);

  --bone:#e8eff0;
  --film:#8ba3ab;
  --film-dim:#5a7078;
  --flag:#e8a552;

  --nav-h:58px;
  --pad:22px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  overflow:hidden;
  background:var(--ink-900);
  color:var(--bone);
  font-family:'Noto Sans TC',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ═══════════════ FEED ═══════════════ */
#feed{
  height:100dvh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  overscroll-behavior-y:contain;
}
#feed::-webkit-scrollbar{display:none}

.card{
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--ink-800);
}
/* 每張卡有極輕微的色溫差，像翻頁 */
.card:nth-child(even){background:var(--ink-900)}

/* 上方一道光 —— 手術燈 */
.card::before{
  content:'';
  position:absolute;
  inset:0 0 auto 0;
  height:45%;
  background:radial-gradient(ellipse 80% 100% at 50% 0%,
    rgba(63,210,172,.055) 0%, transparent 70%);
  pointer-events:none;
}

/* ═══════════════ HEADER ═══════════════ */
.hdr{
  flex:none;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) 12px;
  border-bottom:1px solid var(--line-soft);
  position:relative;
  z-index:5;
}
.brand{
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:17px;
  letter-spacing:.5px;
  color:var(--bone);
  white-space:nowrap;
}
.brand em{font-style:normal;color:var(--drape)}

.hdr-meta{
  display:flex;
  align-items:baseline;
  gap:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--film-dim);
  white-space:nowrap;
}
.hdr-meta b{color:var(--drape);font-weight:500}

/* ═══════════════ BODY (content-first, top aligned) ═══════════════ */
.body{
  flex:1;
  overflow-y:auto;
  scrollbar-width:none;
  padding:16px var(--pad) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);
  position:relative;
  z-index:2;
}
.body::-webkit-scrollbar{display:none}

/* ── 證據等級 chip：這頁的招牌。外科醫師掃文獻先看這個 ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.08em;
  padding:5px 9px 4px;
  border-radius:3px;
  line-height:1;
  white-space:nowrap;
}
/* 證據等級用實心底 —— 視覺上最重 */
.chip-ev{
  background:var(--drape);
  color:var(--ink-900);
  font-weight:500;
}
/* 證據等級較弱的用空心，誠實一點 */
.chip-ev.weak{
  background:transparent;
  color:var(--drape);
  box-shadow:inset 0 0 0 1px var(--drape-deep);
}
.chip-j{
  background:transparent;
  color:var(--film);
  box-shadow:inset 0 0 0 1px var(--line);
}

/* ── 標題：中文優先 ── */
.title-zh{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  font-size:clamp(19px,4.6vw,23px);
  line-height:1.5;
  letter-spacing:.01em;
  color:#fff;
  margin-bottom:8px;
  text-wrap:pretty;
}
.title-en{
  font-size:12.5px;
  line-height:1.6;
  color:var(--film-dim);
  margin-bottom:8px;
  text-wrap:pretty;
}
.byline{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--film-dim);
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

/* ── 分節：用細規線與 eyebrow，不用色塊卡片（那太重了） ── */
.sec{margin-bottom:18px}
.sec:last-of-type{margin-bottom:16px}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--drape);
  margin-bottom:9px;
}
.eyebrow::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line-soft);
}
.eyebrow.warm{color:var(--flag)}

/* 中文內文 —— 6 點鐘在昏暗的值班室裡要讀得下去 */
.prose{
  font-size:14.5px;
  line-height:1.85;
  font-weight:300;
  color:var(--bone);
  letter-spacing:.015em;
  text-wrap:pretty;
}

/* 完整摘要預設收起 5 行，一張卡才塞得進一個螢幕，
   上滑才會是「下一篇」而不是「摘要往下捲」 */
.prose.clamped{
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
  position:relative;
}
.more{
  margin-top:9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.06em;
  color:var(--drape);
  background:none;
  border:none;
  padding:3px 0;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.more:hover{color:#6fe3c4}
.more:focus-visible{outline:2px solid var(--drape);outline-offset:2px;border-radius:3px}
.more svg{width:11px;height:11px;transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ── 重點：條列，可掃讀 ── */
.points{list-style:none;display:flex;flex-direction:column;gap:8px}
.points li{
  position:relative;
  padding-left:19px;
  font-size:14px;
  line-height:1.72;
  font-weight:400;
  color:var(--bone);
}
.points li::before{
  content:'';
  position:absolute;
  left:0;
  top:.72em;
  width:7px;
  height:2px;
  background:var(--drape);
}

/* ── 臨床意義：唯一的暖色區塊 ── */
.impact{
  border-left:2px solid var(--flag);
  padding-left:15px;
  font-size:14px;
  line-height:1.78;
  font-weight:300;
  color:#f0e6d8;
}

/* ── 動作列 ── */
.acts{
  display:flex;
  align-items:center;
  gap:8px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.04em;
  padding:9px 13px;
  border-radius:4px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--film);
  cursor:pointer;
  text-decoration:none;
  transition:color .15s,border-color .15s,background .15s;
}
.btn:hover{color:var(--drape);border-color:var(--drape-deep);background:var(--drape-wash)}
.btn:focus-visible{outline:2px solid var(--drape);outline-offset:2px}
.btn svg{width:13px;height:13px;flex:none}
.pmid{
  margin-left:auto;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--film-dim);
  letter-spacing:.04em;
}

/* ═══════════════ 進度軌（右側，顯示今天還剩幾篇） ═══════════════ */
#rail{
  position:fixed;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:4px;
  z-index:50;
  pointer-events:none;
}
.tick{
  width:2px;
  height:9px;
  border-radius:1px;
  background:rgba(150,190,200,.2);
  transition:background .25s,height .25s;
}
.tick.on{background:var(--drape);height:20px}

/* ═══════════════ NAV ═══════════════ */
#nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(7,13,16,.9);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  z-index:100;
}
.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:7px 0;
  background:none;border:none;
  font-family:'Noto Sans TC',sans-serif;
  font-size:10px;
  font-weight:500;
  color:var(--film-dim);
  cursor:pointer;
  transition:color .15s;
}
.nav-btn.on{color:var(--drape)}
.nav-btn:focus-visible{outline:2px solid var(--drape);outline-offset:-2px;border-radius:4px}
.nav-btn svg{width:21px;height:21px}

/* ═══════════════ 日期抽屜 ═══════════════ */
#sheet{
  position:fixed;
  left:0;right:0;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  background:var(--ink-700);
  border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;
  padding:18px var(--pad) 22px;
  z-index:90;
  transform:translateY(105%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:58vh;
  overflow-y:auto;
  box-shadow:0 -20px 50px rgba(0,0,0,.5);
}
#sheet.open{transform:translateY(0)}
.sheet-hd{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--film-dim);
  margin-bottom:14px;
}
.day{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:13px 14px;
  margin-bottom:6px;
  border-radius:6px;
  border:1px solid var(--line-soft);
  background:transparent;
  color:var(--bone);
  cursor:pointer;
  font-family:inherit;
  text-align:left;
  transition:border-color .15s,background .15s;
}
.day:hover{border-color:var(--drape-deep);background:var(--drape-wash)}
.day:focus-visible{outline:2px solid var(--drape);outline-offset:1px}
.day.on{border-color:var(--drape);background:var(--drape-wash)}
.day-d{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.03em}
.day-n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--drape)}
.day.on .day-n{color:var(--drape)}

/* ═══════════════ 狀態畫面 ═══════════════ */
.state{
  height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 32px calc(var(--nav-h) + 40px);
  gap:14px;
}
.state h2{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  font-size:20px;
  color:var(--bone);
}
.state p{font-size:13.5px;line-height:1.9;color:var(--film-dim);max-width:30ch}
.state .mark{
  width:34px;height:34px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;place-items:center;
  color:var(--film-dim);
  margin-bottom:4px;
}

/* 骨架屏 */
.skel{padding:20px var(--pad)}
.sk{height:13px;border-radius:3px;background:var(--ink-600);margin-bottom:11px;animation:pulse 1.6s ease-in-out infinite}
.sk.t{height:24px;width:88%;margin-bottom:16px}
.sk.w70{width:70%}.sk.w85{width:85%}.sk.w50{width:50%}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}

/* ═══════════════ 開場 ═══════════════ */
#boot{
  position:fixed;inset:0;
  background:var(--ink-900);
  display:grid;place-items:center;
  z-index:999;
  transition:opacity .45s ease;
}
#boot.gone{opacity:0;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:16px}
.boot-mark{
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:38px;
  letter-spacing:1px;
  color:#fff;
}
.boot-mark em{font-style:normal;color:var(--drape)}
.boot-line{
  width:52px;height:1px;
  background:var(--drape);
  transform-origin:center;
  animation:sweep 1.3s ease-in-out infinite;
}
@keyframes sweep{0%,100%{transform:scaleX(.25);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.boot-sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  letter-spacing:.28em;
  color:var(--film-dim);
  text-transform:uppercase;
}

/* 桌機：把卡片收成一欄，別把行長拉到 1900px */
@media (min-width:760px){
  .body{max-width:720px;margin:0 auto;width:100%}
  .hdr{max-width:720px;margin:0 auto;width:100%}
  .prose,.points li,.impact{font-size:15.5px}
}
</style>
</head>
<body>

<div id="boot">
  <div class="boot-in">
    <div class="boot-mark">腸嚐<em>新知</em></div>
    <div class="boot-line"></div>
    <div class="boot-sub">Colorectal Digest</div>
  </div>
</div>

<main id="feed" aria-live="polite"></main>

<div id="rail" aria-hidden="true"></div>

<nav id="nav">
  <button class="nav-btn on" id="nb-today" onclick="goTop()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    今日
  </button>
  <button class="nav-btn" id="nb-date" onclick="toggleSheet()" aria-expanded="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    日期
  </button>
  <button class="nav-btn" id="nb-reload" onclick="hardRefresh()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    更新
  </button>
</nav>

<div id="sheet" role="dialog" aria-label="選擇日期">
  <div class="sheet-hd">往前查</div>
  <div id="days"></div>
</div>

<script>
/* ═══════════════ 設定 ═══════════════ */
const USER = 'aj63236';
const REPO = 'Pubmed-for-CRS';
// 同 repo 內相對路徑即可，換帳號/repo 也不用改
const DATA = './data';

/* ═══════════════ 狀態 ═══════════════ */
let papers = [], days = [], today = '', sheetOpen = false;

/* 較弱的證據等級 → chip 用空心，別假裝很強 */
const WEAK = ['回溯性研究','病例系列','綜述','其他'];

/* ═══════════════ 啟動 ═══════════════ */
async function boot(){
  try{
    const r = await fetch(`${DATA}/index.json?v=${Date.now()}`);
    if(!r.ok) throw 0;
    days = await r.json();
    renderDays();
    if(days.length) await load(days[0].date);
    else state('還沒有資料','跑一次收集腳本，或到 GitHub Actions 手動觸發「每日文獻收集」。');
  }catch{
    state('連不上資料','確認 data/index.json 已推上 GitHub Pages。');
  }
  setTimeout(()=>document.getElementById('boot').classList.add('gone'), 700);
}

async function load(date){
  today = date;
  skeleton();
  try{
    const r = await fetch(`${DATA}/${date}.json?v=${Date.now()}`);
    if(!r.ok) throw 0;
    const d = await r.json();
    papers = d.papers || [];
    render();
  }catch{
    state('這天讀不到', `找不到 data/${date}.json`);
  }
  renderDays();
}

/* ═══════════════ 畫面 ═══════════════ */
function render(){
  const feed = document.getElementById('feed');
  if(!papers.length){
    state('這天沒有新文獻','PubMed 在這個區間沒有符合條件的論文。試試往前查其他日期。');
    return;
  }
  feed.innerHTML = papers.map((p,i)=>card(p,i)).join('');
  buildRail();
  watch();
  feed.scrollTop = 0;
}

function card(p,i){
  const zh   = p.title_zh || p.title;
  const en   = p.title_zh ? p.title : '';
  const abs  = p.abstract_zh || '';
  const pts  = Array.isArray(p.key_points) ? p.key_points : [];
  const imp  = p.impact || '';
  const ev   = p.evidence_level || '';
  const weak = WEAK.includes(ev);

  const who = p.authors
    ? p.authors.split(',').slice(0,2).join(',').trim() + (p.authors.split(',').length>2 ? ' et al.' : '')
    : '';
  const when = [p.year, p.month].filter(Boolean).join(' ');

  // 沒有中文摘要 = 腳本跑的時候沒有 API key
  const noAI = !abs && !pts.length;

  return `
<article class="card" data-i="${i}">
  <header class="hdr">
    <div class="brand">腸嚐<em>新知</em></div>
    <div class="hdr-meta"><span>${fmtDay(today)}</span><b>${i+1}</b>/${papers.length}</div>
  </header>

  <div class="body">
    <div class="chips">
      ${ev ? `<span class="chip chip-ev ${weak?'weak':''}">${esc(ev)}</span>` : ''}
      ${p.journal ? `<span class="chip chip-j">${esc(p.journal)}</span>` : ''}
      ${when ? `<span class="chip chip-j">${esc(when)}</span>` : ''}
    </div>

    <h1 class="title-zh">${esc(zh)}</h1>
    ${en ? `<p class="title-en">${esc(en)}</p>` : ''}
    <p class="byline">${esc(who)}</p>

    ${noAI ? `
      <section class="sec">
        <div class="eyebrow">原文摘要</div>
        <p class="prose">${esc(p.abstract||'（無摘要）')}</p>
      </section>
      <section class="sec">
        <div class="eyebrow warm">尚未翻譯</div>
        <p class="impact">收集腳本執行時沒有讀到 ANTHROPIC_API_KEY。到 GitHub → Settings → Secrets → Actions 設好之後，重跑一次 workflow。</p>
      </section>
    ` : `
      ${abs ? `
      <section class="sec">
        <div class="eyebrow">摘要</div>
        <p class="prose clamped" id="abs${i}">${esc(abs)}</p>
        <button class="more" aria-expanded="false" aria-controls="abs${i}" onclick="expand(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
          <span>展開全文</span>
        </button>
      </section>` : ''}

      ${pts.length ? `
      <section class="sec">
        <div class="eyebrow">重點</div>
        <ul class="points">${pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </section>` : ''}

      ${imp ? `
      <section class="sec">
        <div class="eyebrow warm">臨床意義</div>
        <p class="impact">${esc(imp)}</p>
      </section>` : ''}
    `}

    <div class="acts">
      <a class="btn" href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>
        PubMed
      </a>
      ${p.doi ? `<a class="btn" href="https://doi.org/${p.doi}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        全文
      </a>` : ''}
      <button class="btn" onclick="share(${i})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg>
        分享
      </button>
      <span class="pmid">${p.pmid}</span>
    </div>
  </div>
</article>`;
}

/* ═══════════════ 進度軌 ═══════════════ */
function buildRail(){
  document.getElementById('rail').innerHTML =
    papers.slice(0,16).map((_,i)=>`<span class="tick ${i===0?'on':''}"></span>`).join('');
}

function watch(){
  const ticks = document.querySelectorAll('.tick');
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i = +e.target.dataset.i;
        ticks.forEach((t,n)=>t.classList.toggle('on', n===i));
      }
    });
  },{threshold:.55});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}

/* ═══════════════ 日期 ═══════════════ */
function renderDays(){
  document.getElementById('days').innerHTML = days.map(d=>`
    <button class="day ${d.date===today?'on':''}" onclick="pick('${d.date}')">
      <span class="day-d">${d.date}</span>
      <span class="day-n">${d.count} 篇</span>
    </button>`).join('');
}

async function pick(date){
  toggleSheet(false);
  await load(date);
}

function toggleSheet(force){
  sheetOpen = typeof force==='boolean' ? force : !sheetOpen;
  document.getElementById('sheet').classList.toggle('open', sheetOpen);
  document.getElementById('nb-date').classList.toggle('on', sheetOpen);
  document.getElementById('nb-date').setAttribute('aria-expanded', sheetOpen);
  document.getElementById('nb-today').classList.toggle('on', !sheetOpen);
}

function goTop(){
  toggleSheet(false);
  document.getElementById('feed').scrollTo({top:0,behavior:'smooth'});
}

function hardRefresh(){
  if('caches' in window) caches.keys().then(k=>k.forEach(c=>caches.delete(c)));
  location.reload();
}

/* ═══════════════ 展開全文 ═══════════════ */
function expand(btn){
  const p = document.getElementById(btn.getAttribute('aria-controls'));
  const nowClamped = p.classList.toggle('clamped');
  btn.setAttribute('aria-expanded', String(!nowClamped));
  btn.querySelector('span').textContent = nowClamped ? '展開全文' : '收合';
}

/* ═══════════════ 分享 ═══════════════ */
async function share(i){
  const p = papers[i]; if(!p) return;
  const pts = (p.key_points||[]).map(x=>'· '+x).join('\n');
  const text = `【腸嚐新知】${p.title_zh||p.title}\n\n${pts}\n\n${p.impact||''}\n\nhttps://pubmed.ncbi.nlm.nih.gov/${p.pmid}/`;
  if(navigator.share){ try{ await navigator.share({text}); }catch{} }
  else { try{ await navigator.clipboard.writeText(text); alert('已複製'); }catch{} }
}

/* ═══════════════ 小工具 ═══════════════ */
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function fmtDay(d){
  if(!d) return '';
  const [,m,day] = d.split('-');
  return `${+m}月${+day}日`;
}

function skeleton(){
  document.getElementById('feed').innerHTML = `
    <div class="card"><div class="skel" style="padding-top:80px">
      <div class="sk w50" style="height:10px"></div>
      <div class="sk t"></div><div class="sk t w70"></div>
      <div class="sk"></div><div class="sk w85"></div><div class="sk"></div>
      <div class="sk w70"></div><div class="sk w85"></div><div class="sk w50"></div>
    </div></div>`;
  document.getElementById('rail').innerHTML = '';
}

function state(title, msg){
  document.getElementById('feed').innerHTML = `
    <div class="state">
      <div class="mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
        </svg>
      </div>
      <h2>${esc(title)}</h2>
      <p>${esc(msg)}</p>
    </div>`;
  document.getElementById('rail').innerHTML = '';
  document.getElementById('boot').classList.add('gone');
}

/* 鍵盤（桌機）：j/k 或方向鍵，直接跳整張卡 */
function step(dir){
  const cards = [...document.querySelectorAll('.card')];
  if(!cards.length) return;
  const feed = document.getElementById('feed');
  const cur  = Math.round(feed.scrollTop / feed.clientHeight);
  const next = Math.min(Math.max(cur + dir, 0), cards.length - 1);
  cards[next].scrollIntoView({behavior:'smooth'});
}

addEventListener('keydown', e=>{
  if(e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); step(1); }
  if(e.key==='ArrowUp'  ||e.key==='k'){ e.preventDefault(); step(-1); }
  if(e.key==='Escape' && sheetOpen) toggleSheet(false);
});

document.getElementById('feed').addEventListener('touchstart', ()=>{
  if(sheetOpen) toggleSheet(false);
}, {passive:true});

/* PWA */
if('serviceWorker' in navigator){
  addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

boot();
</script>
</body>
</html>
