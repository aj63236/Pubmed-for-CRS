name: 回補歷史文獻

# 只能手動觸發。到 Actions → 回補歷史文獻 → Run workflow
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: '起始日 YYYY-MM-DD'
        required: true
        default: '2026-06-01'
      to_date:
        description: '結束日 YYYY-MM-DD（留空 = 今天）'
        required: false
        default: ''
      max_per_day:
        description: '每天最多抓幾篇'
        required: true
        default: '8'
      dry_run:
        description: '試算模式（只估價，不花錢）—— 第一次請務必勾選'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 回補可能要跑很久

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 回補
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          # 想換模型：Settings → Secrets and variables → Actions → Variables
          # 新增 MODEL，值可填 claude-haiku-4-5-20251001（便宜但分析較弱）
          MODEL: ${{ vars.MODEL }}
        run: |
          ARGS="--from ${{ inputs.from_date }} --max-per-day ${{ inputs.max_per_day }}"

          if [ -n "${{ inputs.to_date }}" ]; then
            ARGS="$ARGS --to ${{ inputs.to_date }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
            echo "🧪 試算模式 —— 不會花錢"
          else
            echo "💸 實跑模式 —— 會呼叫 Claude API 並產生費用"
          fi

          echo "執行：python -u backfill.py $ARGS"
          echo ""
          python -u backfill.py $ARGS

      # ⚠️ 驗證與 commit 都不再用 dry_run 當條件。
      #
      # 原因：backfill.py 一開頭就會跑 heal_legacy() + rebuild_index()，
      # 那是「修復」動作，不呼叫 Claude、不花任何錢。
      # 但這兩步的成果本來只留在 runner 上 —— 因為 Commit & Push 有
      # `if: dry_run == false`，試算模式直接跳過，runner 一銷毀就沒了。
      #
      # 結果就是：使用者照建議先跑試算，log 顯示「9 天 143 篇」重建成功，
      # repo 裡的 index.json 卻還是空的，網站依舊只看得到一天。
      # 索引「每次跑都會自我修復」的設計，被 workflow 條件擋在門外。
      #
      # 試算模式不會寫任何日檔（fp.save 根本沒被呼叫），
      # 所以這裡能 commit 到的，只有修好的衍生資料。
      - name: 資料驗證（壞資料就不要推上網站）
        run: python -u validate_data.py

      - name: Commit & Push
        run: |
          git config user.name  "腸嚐新知 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "無變更"
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              git commit -m "🔧 修復索引（試算模式，未呼叫 API）"
            else
              git commit -m "📚 回補 ${{ inputs.from_date }} 起的歷史文獻"
            fi
            git push
          fi
