name: 每日文獻收集

on:
  schedule:
    # UTC 22:00 = 台灣時間隔天 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:        # 允許手動點 Run workflow

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Batch API 是非同步的：多數批次 1 小時內結束，官方 SLA 是 24 小時。
    # 這裡等 45 分鐘（BATCH_WAIT_MIN），等不到就存下 batch_id 收工，
    # 下次執行會把結果領回來 —— 不會重複付費。
    # 公開 repo 的 Actions 分鐘數不計費，等待本身是免費的。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 收集文獻並生成摘要
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          # 想換模型：Settings → Secrets and variables → Actions → Variables
          # 新增 MODEL，值可填 claude-haiku-4-5-20251001（便宜但分析較弱）
          MODEL: ${{ vars.MODEL }}
          # Batch API：input/output 都是同步價 5 折。
          # 這個工作每天 06:00 自動跑、沒有人在等，正是批次的適用情境。
          # 想改回即時（例如手動觸發想馬上看到結果）就設 USE_BATCH=0。
          USE_BATCH: ${{ vars.USE_BATCH || '1' }}
          BATCH_WAIT_MIN: ${{ vars.BATCH_WAIT_MIN || '45' }}
        run: python -u fetch_papers.py

      - name: 回歸測試（IF 配對 / ARR-NNT 方向 / 追蹤命中）
        run: python -u tests.py

      - name: 批次路徑測試（不重複付費 / 結果對回 custom_id）
        run: python -u tests_batch.py

      - name: 資料驗證（壞資料就不要推上網站）
        run: python -u validate_data.py

      - name: Commit & Push
        run: |
          git config user.name  "腸嚐新知 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "無變更，略過 commit"
          else
            git commit -m "📰 $(TZ=Asia/Taipei date +'%Y-%m-%d') 每日文獻更新"
            git push
          fi
