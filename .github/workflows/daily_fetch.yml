name: 每日文獻收集

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 台灣時間早上 06:00
  workflow_dispatch:         # 也可以手動點「Run workflow」觸發

permissions:
  contents: write            # 讓 Action 可以把新資料 push 回去

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 下載 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 執行文獻收集腳本
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_papers.py

      - name: 把新資料 commit 並 push
        run: |
          git config user.name "腸嚐新知 Bot"
          git config user.email "bot@changchang.local"
          git add data/
          git diff --staged --quiet || git commit -m "📰 $(date +'%Y-%m-%d') 每日文獻更新"
          git push
