name: 每日文獻收集

on:
  schedule:
    # UTC 22:00 = 台灣時間隔天 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:        # 允許手動點 Run workflow

permissions:
  contents: write

concurrency:
  group: literature-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Batch API 是非同步的：多數批次 1 小時內結束，官方 SLA 是 24 小時。
    # 這裡等 45 分鐘（BATCH_WAIT_MIN），等不到就存下 batch_id 收工，
    # 下次執行會把結果領回來 —— 不會重複付費。
    # 公開 repo 的 Actions 分鐘數不計費，等待本身是免費的。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 回歸測試（無網路、無 API 費用）
        run: |
          python -u tests.py
          python -u tests_batch.py
          python -u tests_openai.py

      - name: 收集文獻並生成摘要
        id: collect
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Auto selects OpenAI when configured; no provider fallback on API errors.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '12000' }}
          PYTHONUNBUFFERED: "1"
          BATCH_CHECKPOINT: "1"
          # MODEL 僅供尚未遷移或待領的 Anthropic 路徑使用。
          MODEL: ${{ vars.MODEL }}
          # Batch API：input/output 都是同步價 5 折。
          # 這個工作每天 06:00 自動跑、沒有人在等，正是批次的適用情境。
          # 想改回即時（例如手動觸發想馬上看到結果）就設 USE_BATCH=0。
          USE_BATCH: ${{ vars.USE_BATCH || '1' }}
          BATCH_WAIT_MIN: ${{ vars.BATCH_WAIT_MIN || '45' }}
        run: python -u fetch_papers.py

      - name: 保存批次恢復狀態（收集失敗也保留，不重複付費）
        if: ${{ always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != '' }}
        run: bash .github/scripts/checkpoint_batch.sh

      - name: 資料驗證（壞資料就不要推上網站）
        run: python -u validate_data.py

      - name: Commit & Push
        run: |
          git config user.name  "腸嚐新知 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "無變更，略過 commit"
          else
            git commit -m "📰 $(TZ=Asia/Taipei date +'%Y-%m-%d') 每日文獻更新"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 回報收集失敗（恢復狀態已保存）
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1
